name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: build · typecheck · test
    runs-on: ubuntu-latest

    # The query-engine integration suites assert what a real Postgres, a real
    # driver and a real pooler do — identifier folding, returned types, the
    # statement timeout — so a stub cannot stand in for this. They match
    # docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: repanel
          POSTGRES_PASSWORD: repanel
          POSTGRES_DB: repanel
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The same database, reached the way the segment's databases are reached:
      # through a transaction-mode pooler, where a connection is a different
      # server session from one transaction to the next. The engine's per-query
      # timeout is a safety property, and one that only holds on a direct
      # connection does not hold — so it is proved here against the real thing
      # (DECISIONS #063). It matches docker-compose.yml.
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          # Service containers share the job's network and answer to their
          # label, so the pooler reaches Postgres by the name above it.
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_USER: repanel
          DB_PASSWORD: repanel
          DB_NAME: repanel
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_CLIENT_CONN: "100"
          # One server session behind every client, so each statement runs on a
          # session the statement before it just used. That is the condition a
          # per-query bound has to survive, and a larger pool would sometimes
          # hide a bound that leaked.
          DEFAULT_POOL_SIZE: "1"
        ports:
          - 6432:5432

    env:
      # Set here and never conditionally: this is what stops the env-gated
      # suites from skipping in CI, which is the whole point of the job.
      #
      # These are also the *only* database variables this job may set.
      # `DATABASE_URL` in particular must stay unset: the CLI proves it reads an
      # env file without loading it by asserting that `process.env.DATABASE_URL`
      # is still undefined afterwards, and an ambient one makes that proof fail.
      # Nothing in the suite connects to a database of RePanel's own anyway.
      TEST_CUSTOMER_DATABASE_URL: postgres://repanel:repanel@localhost:5432/repanel
      # The same database through the pooler. `statement_timeout` is left out of
      # that service's `ignore_startup_parameters` deliberately: were the engine
      # to ask for it on the connection again, pgbouncer would refuse the
      # connection and this suite would fail — rather than connect and quietly
      # run every query with no limit in force.
      TEST_POOLED_CUSTOMER_DATABASE_URL: postgres://repanel:repanel@localhost:6432/repanel

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # First, because it needs neither the install nor the build: the skill is
      # a generated copy of docs/AUTHORING.md, and a guide edited without a
      # regeneration ships a skill that teaches the previous release. The tests
      # run alongside it because byte-equality cannot catch a generator that
      # started dropping sections — the rulings inside it can.
      - name: The skill must still be what AUTHORING.md says
        run: |
          node --test "scripts/*.test.mjs"
          node scripts/build-skill.mjs --check

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm -r typecheck

      # apps/api validates its environment while its modules are being defined —
      # a misconfigured API should refuse to start rather than fail later — so
      # importing anything under test needs the same `.env` a contributor makes
      # by hand. This is CONTRIBUTING's setup, run verbatim.
      #
      # The appended key wins over the empty one in the example, and is
      # throwaway: nothing here encrypts a value a later step reads back.
      - name: Configure apps/api the way CONTRIBUTING says to
        run: |
          cp apps/api/.env.example apps/api/.env
          printf 'APP_ENCRYPTION_KEY=%s\n' "$(openssl rand -base64 32)" >> apps/api/.env

      - run: pnpm -r test

      # `pnpm -r test` proves the suite passes but leaves no machine-readable
      # trace, and a suite that skipped in silence passes too. This runs the one
      # package that has env-gated specs a second time — three seconds — for a
      # report the next step can actually assert against.
      - name: Re-run apps/api for a report
        run: pnpm --filter @repanel/api exec jest --ci --json --outputFile=jest-report.json

      - name: The integration suite must have run
        run: node .github/scripts/assert-integration-ran.mjs apps/api/jest-report.json

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check walks base..head, so both ends have to be present.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Every commit carries a Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-sign-off.sh
