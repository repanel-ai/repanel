<!doctype html>
<html lang="en" class="theme-runtime">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin</title>
    <script>
      /*
       * The theme, before the first paint. It is read here rather than in the
       * app because the app cannot run until its bundle and its session have
       * both arrived, and until then the page ground would be painted in the
       * other theme. The key is `repanel.theme`, written by
       * features/runtime/use-theme.ts.
       *
       * Light is the entry theme (DECISIONS #035): only an operator who has
       * chosen dark gets dark, and the OS preference is not that choice.
       */
      (function () {
        try {
          if (localStorage.getItem("repanel.theme") === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          /* A store the browser refuses is not a reason to fail to render. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
